[package]
name = "salvage-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
js-sys = "0.3"
leptos = { workspace = true, features = ["csr"] }
leptos_router = { workspace = true }
salvage-crypto-worker = { path = "../crypto-worker" }
salvage-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "Crypto",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "RequestCredentials",
    "Storage",
    "SubtleCrypto",
    "Url",
    "UrlSearchParams",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
] }
